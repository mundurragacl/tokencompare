name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Confirms the JavaScript tokenizers still agree with the committed reference
  # counts. Needs no cloud credentials: vocabularies come from Hugging Face and
  # Claude rows are simply skipped.
  tokenizers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diff against reference counts
        run: pnpm test

  # Regenerates the reference counts with the vendors' own libraries and diffs
  # them, so a drift in either implementation is caught rather than assumed away.
  official-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:setup
      - name: Recount with official tokenizers and diff
        run: pnpm run verify

  # The fixtures must stay at exactly the documented 8,000 characters each, or
  # the code-tax comparison is measuring length rather than content and every
  # number in the README goes stale.
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Assert fixtures are exactly 8,000 characters each
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const TARGET = 8000;
            const prose = readFileSync("fixtures/prose.txt", "utf8");
            const code = readFileSync("fixtures/code.js", "utf8");
            console.log(`prose=${prose.length} code=${code.length} target=${TARGET}`);
            if (prose.length !== TARGET || code.length !== TARGET) {
              console.error("fixtures must both be exactly " + TARGET + " characters; regenerate with `pnpm run fixtures -- --update`");
              process.exit(1);
            }
          '
